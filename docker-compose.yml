name: iam_db

services:
  postgres:
    image: postgres:16-alpine
    container_name: iam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5446:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitoring_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    container_name: iam_liquibase
    build:
      context: .
      dockerfile: docker/liquibase/DockerFile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: ["liquibase"]
    command:
      - --changeLogFile=changelog/changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/iam_db
      - --username=postgres
      - --password=postgres
      - update

volumes:
  postgres_data: